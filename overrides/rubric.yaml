# Eval-only matching rubric. `refresh` must not read this file.
#
# Gold.yaml companies = mega-cap census (on MASTER or not). Gold unpublished_tails
# = production suppress gate. This file is the matcher rubric: hard strata plus a
# holdout that is not used to train YAML, aliases, the gate, or matcher tests.
#
# Positives (`ticker`): this product should publish that N-number as that ticker
# (FAA registrant join, not beneficial owner).
# Negatives (`must_not_ticker`): must not publish as that ticker (review/unmatched is success).
# `not_our_join`: never scored as FN.
#
# `filing` holdout is labeled H3 TPs only (N-number in that CIK's exhibit and
# MASTER registrant is that issuer / operating sub). Not Wheels Up indentures,
# not stale N898M/USAF, not Domino's N147CJ (MASTER Carlisle Capital).
# `vanity` holdout is empty: N40D/N340FL are already in mappings.yaml.
# `identity_hard` holdout is thin (1 issuer, Chevron USA spacing). Do not treat
# a Chevron-only fix as identity solved. Need ≥3 holdout issuers before that
# strategy is testable.
#
# Cap: max two tails per ticker in this file.

