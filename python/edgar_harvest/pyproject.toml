[project]
name = "edgar-harvest"
version = "0.1.0"
description = "SEC EFTS harvest of aircraft N-numbers for tail-to-ticker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
edgartools = ["edgartools>=3.0"]

[project.scripts]
edgar-harvest = "edgar_harvest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
