# Optional GitHub-hosted refresh. Canonical publish is the host systemd timer.
# Do not upload sqlite/changelog artifacts — this repo is public.
# Refresh reads faa-registry-mirror published sqlite, which this runner does not have.
name: refresh

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Host timer only
        run: |
          echo "tail-to-ticker refresh no longer downloads ReleasableAircraft.zip."
          echo "Canonical job is tail-to-ticker-refresh.timer on ct-firehose (FAA_REGISTRY_DB)."
          echo "This workflow does not have the published FAA sqlite; not running refresh."
